spring.application.name=exemplo2-spring-boot-turmaC

# URL de conexão do banco de dados
spring.datasource.url=jdbc:h2:mem:bancoteste

# Usuário padrão do BD
spring.datasource.username=sa
# Senha do usuário padrão
spring.datasource.password=

# Habilita console do H2
spring.h2.console.enabled=true
# URL de acesso ao console do H2
spring.h2.console.path=/h2-console

# Atualiza a estrutura do banco baseada nas classes Java
spring.jpa.hibernate.dll-auto=update